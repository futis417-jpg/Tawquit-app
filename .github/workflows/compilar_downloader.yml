name: Compilar APK de Tawquit App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle en el Servidor
      uses: gradle/actions/setup-gradle@v4

    - name: Forzar generacion de Keystore limpia
      run: |
        # Eliminamos el archivo corrupto antiguo para que no estorbe
        rm -f debug.keystore
        rm -f debug.keystore.base64
        
        # Creamos una clave debug completamente nueva compatible con Java 17
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Compilar la aplicacion con Gradle Nativo
      run: gradle assembleDebug

    - name: Guardar el archivo APK resultante
      uses: actions/upload-artifact@v4
      with:
        name: Tawquit-APK
        path: |
          app/build/outputs/apk/debug/app-debug.apk
